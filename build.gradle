plugins {
    id 'application'

    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jmailen.kotlinter' version '5.2.0'
    id 'com.gradleup.shadow' version '8.3.1'
}

group 'no.nav.template'
version '0.1.1'

jar {
    manifest {
        attributes 'Main-Class': 'no.nav.template.BootstrapKt'
    }
}

shadowJar {
    archiveBaseName = 'app'
    archiveClassifier = ''
}

application {
    mainClass = 'no.nav.template.BootstrapKt'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "no.nav.security:token-validation-core:5.0.29"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"

    implementation 'com.google.code.gson:gson:2.13.2'

    implementation "org.http4k:http4k-core:6.57.2.0"
    implementation "org.http4k:http4k-server-netty:6.57.2.0"
    implementation "org.http4k:http4k-client-okhttp:6.57.2.0"

    implementation "io.github.microutils:kotlin-logging:3.0.5"
    implementation "ch.qos.logback:logback-classic:1.5.34"
    implementation "net.logstash.logback:logstash-logback-encoder:8.1"

    implementation "tools.jackson.core:jackson-databind:3.1.5" // Transitive dependency for net.logstash.logback:logstash-logback-encoder:9.0
    implementation 'org.json:json:20250517'

    implementation "io.prometheus:simpleclient_common:0.9.0"
    implementation "io.prometheus:simpleclient_hotspot:0.9.0"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
}

tasks.register('npmCi', Exec) {
    workingDir projectDir
    commandLine 'npm', 'ci', '--ignore-scripts'
    inputs.file 'package.json'
    inputs.file 'package-lock.json'
    outputs.dir 'node_modules'
}

tasks.register('frontendBuild', Exec) {
    dependsOn tasks.named('npmCi')
    workingDir projectDir
    commandLine 'npm', 'run', 'build'
    inputs.files fileTree('src/main/resources/gui') {
        include 'index.html', 'main.tsx', 'styles.css'
    }
    inputs.file 'package.json'
    inputs.file 'package-lock.json'
    inputs.file 'tsconfig.json'
    inputs.file 'vite.config.ts'
    outputs.dir layout.buildDirectory.dir('generated/gui')
}

tasks.register('frontendTest', Exec) {
    dependsOn tasks.named('npmCi')
    workingDir projectDir
    commandLine 'npm', 'test'
}

tasks.named('test') {
    dependsOn tasks.named('frontendTest')
}

processResources {
    dependsOn tasks.named('frontendBuild')
    eachFile { details ->
        def legacyGuiRoot = file('src/main/resources/gui').canonicalPath + File.separator
        if (details.file.canonicalPath.startsWith(legacyGuiRoot) && details.file.canonicalPath != legacyGuiRoot + 'ico.png') {
            details.exclude()
        }
    }
    from(layout.buildDirectory.dir('generated/gui')) {
        into 'gui'
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/kotlin'
    test.kotlin.srcDirs += 'src/test/kotlin'
}

kotlin {
    jvmToolchain(21)
}
